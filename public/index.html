        fist.textContent = '👊';
        fist.style.cssText = `
          position:fixed; z-index:375; pointer-events:none;
          font-size:64px; left:${fromX}px; top:${fromY}px; opacity:1;
          transform:translate(-50%,-50%) scale(0.4); transition:none;
        `;
        document.body.appendChild(fist);
        void fist.offsetWidth;

        fist.style.transition = 'left 0.3s ease-in, top 0.3s ease-in, transform 0.3s ease-in';
        fist.style.left = toX + 'px';
        fist.style.top = toY + 'px';
        fist.style.transform = 'translate(-50%,-50%) scale(1.3)';

        // 拳头命中 (950+300=1250ms)
        const onFistHit = () => {
          fist.removeEventListener('transitionend', onFistHit);
          fist.remove();

          sfxPunch();
          sfxHitAudio();
          fxShakeTarget(casterId);
          fxScreenShake();

          // 拳击特效在目标头像处
          fxPunch.style.left = toX + 'px';
          fxPunch.style.top = toY + 'px';
          fxPunch.classList.remove('smash');
          void fxPunch.offsetWidth;
          fxPunch.classList.add('smash');
        };
        fist.addEventListener('transitionend', onFistHit);
      }, 950);
    }

    function fxHeartsExchange() {
      const myR = myAvatarImg.getBoundingClientRect();
      const oppR = oppAvatar.getBoundingClientRect();
      const myX = myR.left + myR.width / 2;
      const myY = myR.top + myR.height / 2;
      const oppX = oppR.left + oppR.width / 2;
      const oppY = oppR.top + oppR.height / 2;

      const hearts = [];
      const totalHearts = 14;
      const spawnHeart = (fromX, fromY, toX, toY, delay) => {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.textContent = ['❤️', '💕', '💖', '💗'][Math.floor(Math.random() * 4)];
          const size = 16 + Math.random() * 22;
          const midX = (fromX + toX) / 2 + (Math.random() - 0.5) * 60;
          const midY = (fromY + toY) / 2 - 40 - Math.random() * 50;
          const dur = 0.7 + Math.random() * 0.5;
          heart.style.cssText = `
            position: fixed; z-index: 355; pointer-events: none;
            font-size: ${size}px;
            left: ${fromX}px; top: ${fromY}px;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.3);
            transition: none;
          `;
          document.body.appendChild(heart);
          hearts.push(heart);
          void heart.offsetWidth;
          // 两段飞行：先到中点，再到目标（形成弧线）
          heart.style.transition = 'left 0.35s ease-out, top 0.35s ease-out, transform 0.35s ease-out, opacity 0.35s';
          heart.style.left = midX + 'px';
          heart.style.top = midY + 'px';
          heart.style.opacity = '1';
          heart.style.transform = 'translate(-50%, -50%) scale(1)';
          setTimeout(() => {
            heart.style.transition = 'left 0.35s ease-in, top 0.35s ease-in, transform 0.35s ease-in, opacity 0.35s';
            heart.style.left = toX + 'px';
            heart.style.top = toY + 'px';
            heart.style.transform = 'translate(-50%, -50%) scale(0.6)';
            heart.style.opacity = '0.5';
          }, 350);
        }, delay);
      };

      // 双方各发射7颗心，交替
      for (let i = 0; i < totalHearts; i++) {
        spawnHeart(myX, myY, oppX, oppY, i * 110);
        spawnHeart(oppX, oppY, myX, myY, i * 110 + 55);
      }

      setTimeout(() => hearts.forEach(h => h.remove()), 2500);
    }

    // ---- 效果映射表 ----
    const SKILL_EFFECTS = {
      'single_4': { sound: 'slash', visuals: ['hit'], dur: 3000 },
      'single_5': { sound: 'shield', visuals: ['shieldUp'], dur: 2000 },
      'single_6': { sound: 'healAudio', visuals: ['waterDrop', 'healGlow'], dur: 1500 },
      'single_8': { sound: null, visuals: ['gun'], dur: 1500 },
      'single_0': { sound: ['punch', 'hitAudio'], visuals: ['punch', 'screenShake'], dur: 800 },
      'combo_22': { sound: 'powerUp', visuals: ['intelLaser'], dur: 2500 },
      'combo_19': { sound: ['hougongshu'], visuals: ['hit_both', 'screenShake', 'heartsRain'], dur: 2500 },
      'combo_69': { sound: ['seyoushu'], visuals: ['healGlow_both', 'heartsExchange'], dur: 2200 },
      'combo_61': { sound: ['bow'], visuals: ['arrow1'], dur: 1800 },
      'combo_62': { sound: ['bow'], visuals: ['arrow2'], dur: 2000 },
      'combo_63': { sound: ['bow'], visuals: ['arrow3'], dur: 2200 },
      'combo_910': { sound: ['cfshoulei'], visuals: ['throwGrenade', 'screenShake', 'hit_both'], dur: 2800 },
      'combo_15': { sound: 'seal', visuals: ['shieldUp', 'sealLock'], dur: 2500 },
      'combo_58': { sound: 'peace', visuals: ['peaceGlow'], dur: 2000 },
      'combo_510': { sound: null, visuals: ['shieldUp', 'combo510'], dur: 1800 },
      'combo_55': { sound: null, visuals: ['shieldUp', 'slapFlurry', 'bigText_降龙十八掌'], dur: 2000 },
      'combo_1010': { sound: ['oula'], visuals: ['punchFlurry', 'bigText_白金连打'], dur: 2500 },
      'combo_77': { sound: ['sageMode', 'healAudio'], visuals: ['sageAura', 'narutoFlash', 'healGlow'], dur: 3000 },
      'combo_88': { sound: null, visuals: ['dualGun'], dur: 2200 },
      'nine_revive': { sound: 'wineAudio', visuals: ['reviveGlow', 'bigText_喝酒复活'], dur: 1500 },
      'combo_19_self': { sound: ['hougongshu'], visuals: ['hit'], dur: 800 },
    };

    // ---- 主调度 ----
    function playSkillEffect(skillId, casterId, targetHand) {
      const cfg = SKILL_EFFECTS[skillId];
      if (!cfg) return;

      // 动画期间锁定操作（按动画实际时长）
      animLocked = true;
      clearTimeout(animLocked._timer);
      animLocked._timer = setTimeout(() => { animLocked = false; }, cfg.dur || 2000);

      // 目标手特效（双方可见，combo_15 走 SKILL_CAST 通道）
      if (targetHand && skillId === 'combo_15') {
        setTimeout(() => sfxSealSelect(), 400);
        // 攻击方看对面手（视觉翻转），被攻击方看自己手（不翻转）
        const iAmCaster = casterId === myPlayerId;
        let handEl;
        if (iAmCaster) {
          // 对面的实际左手在我右边，实际右手在我左边
          handEl = (targetHand === 'left') ? oppRight : oppLeft;
        } else {
          // 我被封印，看自己的手
          handEl = (targetHand === 'left') ? myLeft : myRight;
        }
        setTimeout(() => fxClockOnHand(handEl), 440);
      }

      // 音效
      const soundMap = { slash: sfxSlash, shield: sfxShield, heal: sfxHeal, gun: sfxGun,
        punch: sfxPunch, hit: sfxHit, explosion: sfxExplosion, bow: sfxBow,
        seal: sfxSeal, peace: sfxPeace, powerUp: sfxPowerUp, revive: sfxRevive,
        sageMode: sfxSageMode, kingCrimson: sfxKingCrimson, waterDrink: sfxWaterDrink, healAudio: sfxHealAudio, hitAudio: sfxHitAudio, wineAudio: sfxWineAudio, seyoushu: sfxSeyoushu, hougongshu: sfxHougongshu, cfshoulei: sfxCfshoulei, oula: sfxOula };
      // 支持单个音效或音效数组
      if (cfg.sound) {
        const sounds = Array.isArray(cfg.sound) ? cfg.sound : [cfg.sound];
        sounds.forEach(s => { if (soundMap[s]) soundMap[s](); });
      }

      // 视觉
      (cfg.visuals || []).forEach(v => {
        switch (v) {
          case 'hit': fxShakeTarget(casterId); break;
          case 'hit_both':
            fxShakeTarget(casterId);
            fxShakeSelf(casterId);
            break;
          case 'slashEffect': fxSlashEffect(); break;
          case 'shieldUp': fxShieldUp(casterId); break;
          case 'healGlow': fxHealGlow(casterId); break;
          case 'healGlow_both':
            fxHealGlow(casterId);
            fxHealGlowTarget(casterId);
            break;
          case 'sageAura': fxSageAura(casterId); break;
          case 'reviveGlow': fxReviveGlow(casterId); break;
          case 'sealLock': fxSealLock(casterId); break;
          case 'screenWhite': fxScreenWhite(); break;
          case 'screenShake': fxScreenShake(); break;
          case 'peaceGlow': fxPeaceGlow(); break;
          case 'arrow1': fxBowVolley(casterId, 1); break;
          case 'arrow2': fxBowVolley(casterId, 2); break;
          case 'arrow3': fxBowVolley(casterId, 3); break;
          case 'intelLaser': fxIntelLaser(casterId); break;
          case 'narutoFlash': fxNarutoFlash(casterId); break;
          case 'bigText_喝酒复活': fxBigTextShow('🍶 喝酒·复活！', '#ffd700'); break;
          case 'bigText_降龙十八掌': fxBigTextShow('🐉 降龙十八掌', '#ffd700'); break;
          case 'bigText_降龙十八拳': fxBigTextShow('🐉 降龙十八拳', '#ff4500'); break;
          case 'bigText_白金连打': fxBigTextShow('⭐ 白金连打！', '#ffd700'); break;
          case 'waterDrop': fxWaterDropAnim(casterId); break;
          case 'kingCrimson': fxKingCrimsonEffect(); break;
          case 'gun': playGunEffect(casterId); break;
          case 'dualGun': fxDualGun(casterId); break;
          case 'punchFlurry': fxPunchFlurry(casterId); break;
          case 'slapFlurry': fxSlapFlurry(casterId); break;
          case 'combo510': fxCombo510(casterId); break;
          case 'punch': fxPunchTarget(casterId); break;
          case 'heartsRain': fxHeartsRain(); break;
          case 'heartsExchange': fxHeartsExchange(); break;
          case 'throwGrenade': fxThrowGrenade(casterId); break;
        }
      });
    }

    function playGunEffect(casterId) {
      const casterAv = casterId === myPlayerId ? myAvatarImg : oppAvatar;
      const targetAv = casterId === myPlayerId ? oppAvatar : myAvatarImg;
      const crosshair = casterId === myPlayerId ? oppCrosshair : myCrosshair;
      const cr = casterAv.getBoundingClientRect();
      const tr = targetAv.getBoundingClientRect();

      const fromX = cr.left + cr.width / 2;
      const fromY = cr.top + cr.height / 2;
      const toX = tr.left + tr.width / 2;
      const toY = tr.top + tr.height / 2;

      // 1. 枪出现在施法者头像处
      gunEffect.style.opacity = '';
      gunEffect.style.left = fromX + 'px';
      gunEffect.style.top = fromY + 'px';
      gunEffect.classList.remove('show', 'kick');
      void gunEffect.offsetWidth;
      gunEffect.classList.add('show');

      // 2. 瞄准：准星出现在目标头像 (400ms)
      setTimeout(() => {
        crosshair.classList.add('active');
      }, 400);

      // 3. 发射子弹 (700ms)
      setTimeout(() => {
        // 开枪音效
        sfxGun();

        // 子弹从枪口出发
        bulletFx.style.left = fromX + 'px';
        bulletFx.style.top = fromY + 'px';
        bulletFx.style.opacity = '1';
        bulletFx.style.transition = 'none';
        bulletFx.style.transform = 'translate(-50%, -50%) scale(0.6)';
        void bulletFx.offsetWidth;

        // 子弹飞向目标
        bulletFx.style.transition = 'left 0.25s linear, top 0.25s linear, transform 0.25s linear';
        bulletFx.style.left = toX + 'px';
        bulletFx.style.top = toY + 'px';
        bulletFx.style.transform = 'translate(-50%, -50%) scale(1.2)';

        // 后座力
        gunEffect.classList.add('kick');
        crosshair.classList.remove('active');

        // 子弹命中 (250ms飞行)
        const onBulletHit = () => {
          bulletFx.removeEventListener('transitionend', onBulletHit);
          bulletFx.style.opacity = '0';
          bulletFx.style.transition = 'none';

          // 命中火光
          muzzleFlash.style.left = toX + 'px';
          muzzleFlash.style.top = toY + 'px';
          muzzleFlash.classList.remove('fire');
          void muzzleFlash.offsetWidth;
          muzzleFlash.classList.add('fire');

          // 目标头像变黑
          targetAv.classList.add('charred');

          // 受击音效 + 震动
          sfxHitAudio();
          fxShakeTarget(casterId);

          // 头像恢复
          setTimeout(() => {
            targetAv.classList.remove('charred');
            targetAv.classList.add('recover');
            setTimeout(() => targetAv.classList.remove('recover'), 1500);
          }, 800);

          // 清理枪
          setTimeout(() => {
            gunEffect.classList.remove('show', 'kick');
            gunEffect.style.opacity = '0';
          }, 300);
        };
        bulletFx.addEventListener('transitionend', onBulletHit);
      }, 700);
    }

    function showSkillCast(message, casterId) {
      skillCastNotice.textContent = message;
      const avatar = casterId === myPlayerId ? myAvatarImg : oppAvatar;
      const rect = avatar.getBoundingClientRect();
      skillCastNotice.style.top = (rect.top + rect.height / 2) + 'px';
      skillCastNotice.style.left = (rect.left - 14) + 'px';
      skillCastNotice.classList.remove('hidden');
      clearTimeout(skillCastNotice._timer);
      skillCastNotice._timer = setTimeout(() => {
        skillCastNotice.classList.add('hidden');
      }, 1800);
    }

    function showActionNotice(message) {
      actionNotice.textContent = message;
      actionNotice.classList.remove('hidden', 'show');
      void actionNotice.offsetWidth;
      actionNotice.classList.add('show');
      clearTimeout(actionNotice._timer);
      actionNotice._timer = setTimeout(() => {
        actionNotice.classList.add('hidden');
      }, 2500);
    }

    skipSkillBtn.addEventListener('click', () => {
      if (animLocked) return;
      ws.send(JSON.stringify({ type: 'SKILL_CHOICE', skillId: 'none' }));
      skillModal.classList.add('hidden');
      exitSkillTargetMode();
    });

    cancelSkillTargetBtn.addEventListener('click', () => {
      if (animLocked) return;
      exitSkillTargetMode();
      if (pendingSkillOptions && pendingSkillOptions.length) {
        showSkillPanel(pendingSkillOptions);
      }
    });


    readyBtn.addEventListener('click', () => {
      ws.send(JSON.stringify({ type: 'READY', avatar: myAvatar, nickname: myNickname }));
      readyBtn.classList.add('hidden');
      profileSetup.classList.add('hidden');
      statusMsg.textContent = '等待对方准备...';
    });

    // -------- 上帝调试面板 --------
    function debugSetHand(hand) {
      if (animLocked) return;
      const input = document.getElementById(hand === 'left' ? 'debugLeftVal' : 'debugRightVal');
      const val = parseInt(input.value, 10);
      if (isNaN(val) || val < 0 || val > 9) { alert('数值 0-9'); return; }
      if (!ws || ws.readyState !== 1) { alert('未连接'); return; }
      ws.send(JSON.stringify({ type: 'DEBUG_SET_HAND', hand, value: val }));
    }
    document.getElementById('debugSetLeft').addEventListener('click', () => debugSetHand('left'));
    document.getElementById('debugSetRight').addEventListener('click', () => debugSetHand('right'));
  </script>
</body>
</html>
